[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dikas"
version = "0.1.0"
description = "Lokales Rechnungs- und Kassensystem für den Verein"
requires-python = ">=3.15"
dependencies = [
    "PySide6>=6.12",
    "SQLAlchemy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.gui-scripts]
dikas = "dikas.app:main"

[tool.setuptools.packages.find]
include = ["dikas*"]

[tool.setuptools.package-data]
"dikas.ui" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
